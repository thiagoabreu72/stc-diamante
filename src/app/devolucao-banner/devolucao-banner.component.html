<div class="devolucao-card mb-3" *ngIf="motivo">
  <div class="devolucao-card-icone">
    <i class="pi pi-replay"></i>
  </div>
  <div class="devolucao-card-conteudo">
    <span class="devolucao-card-titulo"
      >Solicitação devolvida pela Contabilidade Orçamentária — corrija o que for necessário</span
    >
    <span class="devolucao-card-motivo-rotulo">Motivo da devolução</span>
    <p class="devolucao-card-motivo">{{ motivo }}</p>
  </div>
</div>
